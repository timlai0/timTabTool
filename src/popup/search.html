<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>timTabTool Search</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16.png" />
  <link rel="shortcut icon" href="/icons/icon-32.png" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      min-width: 800px;
      min-height: 600px;
      background: var(--bg-primary, #ffffff);
      overflow: hidden;
      display: flex;
    }
    #app {
      width: 380px;
      height: 100%;
      border-right: 0.5px solid var(--border);
      background: var(--bg-primary);
      flex-shrink: 0;
      position: relative;
      z-index: 100;
    }
    #search-col {
      flex: 1;
      height: 100%;
      position: relative;
      z-index: 1;
      background: var(--bg-primary);
      overflow: hidden;
    }
    body.settings-active #app {
      width: 100% !important;
      border-right: none !important;
    }
    body.settings-active #search-col {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="search-col"></div>
  <script type="module" src="./search-page.ts"></script>
</body>
</html>
